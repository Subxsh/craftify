services:
  # Backend API Service
  - type: web
    name: craftify-backend
    env: node
    region: oregon
    buildCommand: cd E-commmerce/backend && npm install
    startCommand: cd E-commmerce/backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: craftify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: craftify-frontend
          property: host
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: craftify-frontend
    env: static
    buildCommand: cd E-commmerce/frontend && npm install && npm run build
    staticPublishPath: E-commmerce/frontend/build
    routes:
      - type: redirect
        source: /*
        destination: /index.html

databases:
  - name: craftify-db
    databaseName: craftify
    user: craftify_user